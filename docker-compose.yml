services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Dibaca otomatis dari file .env di root proyek oleh docker compose.
      # Tanpa .env pun jalan: endpoint preset/geo tetap hidup (tanpa AI upload).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Di-bake saat build; browser memanggil backend langsung dari host.
        # Deploy ke server: jalankan dengan NEXT_PUBLIC_BACKEND_URL=https://<domain-backend>
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
